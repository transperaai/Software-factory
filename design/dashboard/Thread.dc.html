<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Thread explorer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F5F7;color:#15171C;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;line-height:1.5}
a{color:#2546C8}a:hover{color:#1A3496}
.app{display:flex;flex-wrap:wrap;min-height:100vh}
.rail{flex:1 1 220px;box-sizing:border-box;padding:24px 16px;background:#fff;border-right:1px solid #E2E5EA;display:flex;flex-direction:column;gap:28px}
.main{flex:999 1 560px;min-width:0;box-sizing:border-box;padding:32px 36px 56px}
.inner{max-width:1080px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px;padding:0 12px}
.mark{width:22px;height:22px;border-radius:6px;background:#15171C}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:40px;padding:0 12px;border-radius:8px;color:#4A505C;text-decoration:none;font-weight:500}
.nav a:hover{background:#F4F5F7;color:#15171C}
.nav a.on{background:#E8EDFC;color:#1A3496}
.count{min-width:22px;height:22px;border-radius:11px;background:#B45309;color:#fff;font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;padding:0 7px;box-sizing:border-box}
.label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#646B78}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:8px;border:1px solid #D5D9E0;background:#fff;color:#15171C;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{background:#F4F5F7;color:#15171C}
.crumb{min-height:36px;padding:0 6px;border:0;background:transparent;font:inherit;font-weight:600;color:#2546C8;cursor:pointer;border-radius:6px}
.crumb:hover{background:#E8EDFC}
.card{background:#fff;border:1px solid #E2E5EA;border-radius:12px}
.row{display:grid;grid-template-columns:120px 110px minmax(0,1fr) 150px 40px;gap:16px;align-items:center;width:100%;box-sizing:border-box;min-height:56px;padding:0 20px;border:0;border-top:1px solid #EEF0F3;background:#fff;font:inherit;color:inherit;text-align:left}
button.row{cursor:pointer}
button.row:hover{background:#F5F7FE}
.head{min-height:44px;border-top:0;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#646B78}
input[type=search]{font:inherit;min-height:44px;padding:0 12px;border-radius:8px;border:1px solid #B9C2D0;background:#fff;box-sizing:border-box;width:100%}
@media (max-width:720px){.nav{flex-direction:row;flex-wrap:wrap}.main{padding:24px 16px 48px}.rail{border-right:0;border-bottom:1px solid #E2E5EA}.row{grid-template-columns:96px minmax(0,1fr) 28px;padding:10px 16px}.hide-sm{display:none}}
</style>
</helmet>
<div class="app">
  <aside class="rail">
    <div class="brand"><span class="mark" aria-hidden="true"></span><span>Factory</span></div>
    <nav class="nav" aria-label="Main">
      <a href="Main.dc.html">Overview <span class="count">6</span></a>
      <a href="Project.dc.html">Projects</a>
      <a href="Board.dc.html">Board</a>
      <a href="Testing.dc.html">Testing</a>
      <a href="Thread.dc.html" class="on" aria-current="page">Thread explorer</a>
      <a href="Accounts.dc.html">Test accounts</a>
      <a href="Integrations.dc.html">Integrations</a>
      <a href="Cost.dc.html">Cost</a>
      <a href="Factory.dc.html">Factory</a>
    </nav>
  </aside>

  <main class="main">
    <div class="inner" style="display: flex; flex-direction: column; gap: 20px">

      <header style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <div class="label">Acme Ops Portal</div>
          <h1 style="margin: 0; font-size: 24px; line-height: 1.25; font-weight: 600">Thread explorer</h1>
        </div>
        <div style="flex: 0 1 320px">
          <label for="find" style="position: absolute; left: -9999px">Find a record</label>
          <input id="find" type="search" placeholder="Jump to an ID, such as US-12">
        </div>
      </header>

      <nav aria-label="You are here" style="display: flex; flex-wrap: wrap; align-items: center; gap: 2px; font-size: 16px">
        <sc-for list="{{crumbs}}" as="c" hint-placeholder-count="3">
          <span style="display: inline-flex; align-items: center; gap: 2px">
            <sc-if value="{{c.link}}" hint-placeholder-val="{{ true }}">
              <button type="button" class="crumb" onClick="{{c.go}}">{{c.label}}</button>
              <span style="color: #9AA3B2; padding: 0 4px" aria-hidden="true">›</span>
            </sc-if>
            <sc-if value="{{c.here}}" hint-placeholder-val="{{ false }}">
              <span style="font-weight: 600; padding: 0 6px" aria-current="page">{{c.label}}</span>
            </sc-if>
          </span>
        </sc-for>
      </nav>

      <section class="card" style="padding: 24px; display: flex; flex-direction: column; gap: 10px" aria-labelledby="lvl-h">
        <span class="label">{{level.kicker}}</span>
        <h2 id="lvl-h" style="margin: 0; font-size: 19px; line-height: 1.3; font-weight: 600">{{level.title}}</h2>
        <sc-if value="{{level.hasFrom}}" hint-placeholder-val="{{ false }}">
          <p style="margin: 0; color: #4A505C; font-size: 14px"><span style="font-weight: 600; color: #15171C">Came from</span> {{level.from}}</p>
        </sc-if>
      </section>

      <section class="card" style="overflow: hidden" aria-label="{{level.listName}}">
        <div>
          <div class="row head" aria-hidden="true">
            <span>ID</span>
            <span class="hide-sm">Type</span>
            <span>Title</span>
            <span class="hide-sm">Status</span>
            <span><span style="position: absolute; left: -9999px">Open</span></span>
          </div>
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
            <div style="display: block">
              <sc-if value="{{r.deeper}}" hint-placeholder-val="{{ true }}">
                <button type="button" class="row" onClick="{{r.go}}" aria-label="Open {{r.id}}: {{r.title}}">
                  <span class="mono" style="font-weight: 600">{{r.id}}</span>
                  <span class="hide-sm" style="color: #4A505C; font-size: 14px">{{r.type}}</span>
                  <span style="font-weight: 500">{{r.title}}</span>
                  <span class="hide-sm" style="font-size: 14px; font-weight: 600; color: {{r.fg}}">{{r.status}}</span>
                  <span style="color: #2546C8; font-size: 20px; text-align: right" aria-hidden="true">›</span>
                </button>
              </sc-if>
              <sc-if value="{{r.leaf}}" hint-placeholder-val="{{ false }}">
                <div class="row" style="background: {{r.bg}}">
                  <span class="mono" style="font-weight: 600">{{r.id}}</span>
                  <span class="hide-sm" style="color: #4A505C; font-size: 14px">{{r.type}}</span>
                  <span style="font-weight: 500">{{r.title}}</span>
                  <span class="hide-sm" style="font-size: 14px; font-weight: 600; color: {{r.fg}}">{{r.status}}</span>
                  <span></span>
                </div>
              </sc-if>
            </div>
          </sc-for>
        </div>
      </section>

      <div style="display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center">
        <sc-if value="{{canBack}}" hint-placeholder-val="{{ true }}">
          <button type="button" class="btn" onClick="{{back}}">← Back to {{backLabel}}</button>
        </sc-if>
        <span style="font-size: 14px; color: #646B78">{{hint}}</span>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1360}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { path: [0, 0] };
  }
  renderVals() {
    var self = this;
    var D = 'Done', P = 'Passing', A = 'Approved';
    // delivery item: [id, type, title, status, kind]  kind: d done, n in progress, x not yet, g gap
    var brs = [
      { id: 'BR-04', title: 'Invoices over $5,000 need two approvers', from: 'Priya Nair (SH-04) in the 3 Sep workshop (SRC-014). Measured by KPI-02: 0% today, target 100%.', stories: [
        { id: 'US-12', title: 'Send an invoice over $5,000 for a second approval', items: [
          ['RULE-05', 'Rule', 'Second approver must be a different person', D, 'd'],
          ['FR-08', 'Spec', 'Two-step approval for high-value invoices', D, 'd'],
          ['SL-04', 'Slice', 'Invoice approval', 'In review', 'n'],
          ['PR #41', 'Code', '14 files, on the integration branch', 'In review', 'n'],
          ['TC-31 to 35', 'Tests', '5 automated tests, including 2 abuse cases', P, 'd'],
          ['UAT-12', 'UAT', 'Two approvers sign off INV-1043 ($7,200)', 'Monday', 'x'],
          ['REL-1.0', 'Release', 'First release', '6 Nov', 'x']
        ] },
        { id: 'US-13', title: 'Reject an invoice with a reason', items: [
          ['FR-09', 'Spec', 'Rejection reasons list', D, 'd'],
          ['SL-04', 'Slice', 'Invoice approval', 'In review', 'n'],
          ['PR #41', 'Code', '14 files, on the integration branch', 'In review', 'n'],
          ['TC-36 to 38', 'Tests', '3 automated tests', P, 'd'],
          ['UAT-13', 'UAT', 'Reject INV-1044 with a reason', 'Monday', 'x'],
          ['REL-1.0', 'Release', 'First release', '6 Nov', 'x']
        ] }
      ] },
      { id: 'BR-02', title: 'Find any invoice in under 10 seconds', from: 'Sam Lee (SH-02) in the 28 Aug interview (SRC-009). Measured by KPI-01.', stories: [
        { id: 'US-05', title: 'Filter invoices by supplier, status and date', items: [
          ['FR-03', 'Spec', 'Filters and search', D, 'd'],
          ['SL-02', 'Slice', 'Filter and sort invoices', 'Accepted', 'd'],
          ['PR #22', 'Code', 'Merged to main', D, 'd'],
          ['TC-10 to 14', 'Tests', '5 automated tests', P, 'd'],
          ['UAT-05', 'UAT', 'Find INV-0981 in under 10 seconds', 'Passed', 'd'],
          ['REL-1.0', 'Release', 'First release', '6 Nov', 'x']
        ] },
        { id: 'US-06', title: 'Sort invoices by any column', items: [
          ['FR-03', 'Spec', 'Filters and search', D, 'd'],
          ['SL-02', 'Slice', 'Filter and sort invoices', 'Accepted', 'd'],
          ['PR #22', 'Code', 'Merged to main', D, 'd'],
          ['TC-15', 'Tests', '1 automated test', P, 'd'],
          ['UAT-06', 'UAT', 'Sort by amount', 'Passed', 'd'],
          ['REL-1.0', 'Release', 'First release', '6 Nov', 'x']
        ] }
      ] },
      { id: 'BR-06', title: 'Capture invoices from PDFs', from: 'Priya Nair (SH-04) in the 10 Sep email thread (SRC-021). Measured by KPI-03.', stories: [
        { id: 'US-17', title: 'Upload invoice PDFs', items: [
          ['FR-11', 'Spec', 'PDF upload and parsing', 'No code yet', 'g'],
          ['SL-06', 'Slice', 'Upload invoice PDFs', 'Building', 'n'],
          ['TC-50 to 52', 'Tests', '3 tests written, not run yet', 'Written', 'n'],
          ['UAT-17', 'UAT', 'Not planned yet', 'Not yet', 'x'],
          ['REL-1.0', 'Release', 'First release', '6 Nov', 'x']
        ] },
        { id: 'US-19', title: 'Flag PDFs that can’t be read', items: [
          ['FR-12', 'Spec', 'Readability check', D, 'd'],
          ['SL-06', 'Slice', 'Upload invoice PDFs', 'Building', 'n'],
          ['Missing', 'Tests', 'No test covers acceptance criterion 2', 'Gap', 'g'],
          ['UAT-19', 'UAT', 'Not planned yet', 'Not yet', 'x'],
          ['REL-1.0', 'Release', 'First release', '6 Nov', 'x']
        ] }
      ] },
      { id: 'BR-07', title: 'Suppliers can check invoice status themselves', from: 'Jo Patel (SH-06) in the 5 Sep workshop (SRC-027). Measured by KPI-04.', stories: [
        { id: 'US-21', title: 'Search suppliers', items: [
          ['FR-14', 'Spec', 'Supplier search', D, 'd'],
          ['SL-05', 'Slice', 'Supplier search', 'Building', 'n'],
          ['PR #47', 'Code', 'Draft', 'Building', 'n'],
          ['TC-40 to 42', 'Tests', '3 automated tests', P, 'd'],
          ['UAT-21', 'UAT', 'Search for Northwind', 'Monday', 'x'],
          ['REL-1.0', 'Release', 'First release', '6 Nov', 'x']
        ] },
        { id: 'US-24', title: 'Send an onboarding email to new suppliers', items: [
          ['FR-16', 'Spec', 'Onboarding email', D, 'd'],
          ['INT-03', 'Interface', 'Email via Postmark', D, 'd'],
          ['SL-08', 'Slice', 'Supplier onboarding emails', 'Planned', 'x'],
          ['REL-1.0', 'Release', 'First release', '6 Nov', 'x']
        ] }
      ] }
    ];
    var fg = { d: '#11602F', n: '#1A3496', x: '#646B78', g: '#8A4307' };
    var path = this.state.path;
    var go = function (p) { return function () { self.setState({ path: p }); }; };
    var gapsIn = function (items) { return items.filter(function (i) { return i[4] === 'g'; }).length; };
    var crumbs = [{ label: 'All requirements', p: [] }];
    var level, rows, hint;
    if (path.length === 0) {
      level = { kicker: 'Acme Ops Portal', title: '18 business requirements (4 shown)', hasFrom: false, from: '', listName: 'Business requirements' };
      rows = brs.map(function (b, bi) {
        var g = 0; b.stories.forEach(function (s) { g += gapsIn(s.items); });
        return { deeper: true, leaf: false, id: b.id, type: 'Requirement', title: b.title, status: g ? g + (g > 1 ? ' gaps' : ' gap') : A, fg: g ? fg.g : fg.d, go: go([bi]) };
      });
      hint = 'Click a requirement to see its stories.';
    } else if (path.length === 1) {
      var b = brs[path[0]];
      crumbs.push({ label: b.id, p: [path[0]] });
      level = { kicker: 'Business requirement · ' + b.id, title: b.title, hasFrom: true, from: b.from, listName: 'Stories' };
      rows = b.stories.map(function (s, si) {
        var g = gapsIn(s.items);
        return { deeper: true, leaf: false, id: s.id, type: 'Story', title: s.title, status: g ? g + (g > 1 ? ' gaps' : ' gap') : A, fg: g ? fg.g : fg.d, go: go([path[0], si]) };
      });
      hint = 'Click a story to see how it was built and tested.';
    } else {
      var b2 = brs[path[0]], s2 = b2.stories[path[1]];
      crumbs.push({ label: b2.id, p: [path[0]] });
      crumbs.push({ label: s2.id, p: path });
      level = { kicker: 'Story · ' + s2.id, title: s2.title, hasFrom: true, from: b2.id + ': ' + b2.title + '. ' + b2.from, listName: 'How it was delivered' };
      rows = s2.items.map(function (it) {
        return { deeper: false, leaf: true, id: it[0], type: it[1], title: it[2], status: it[3], fg: fg[it[4]], bg: it[4] === 'g' ? '#FEF3E2' : '#fff' };
      });
      hint = 'Everything this story turned into, in delivery order.';
    }
    var last = crumbs.length - 1;
    return {
      crumbs: crumbs.map(function (c, i) { return { label: c.label, link: i < last, here: i === last, go: go(c.p) }; }),
      level: level,
      rows: rows,
      hint: hint,
      canBack: path.length > 0,
      backLabel: last > 0 ? crumbs[last - 1].label : '',
      back: go(path.slice(0, -1))
    };
  }
}
</script>
</body>
</html>
