id: ba-solution-parked
description: >-
  Only a solution-shaped opinion (the kanban board) is confirmed. The result is no BRs and one
  parked ask.
setup:
  .factory/runs/r1/input.json: |
    {
      "agent": "ba",
      "project": "acme-ops-portal",
      "profile": "client",
      "source": "SRC-01",
      "claims": [
        { "id": "CLM-01", "words": "I think the team could spot urgent ones at a glance if we had a kanban board.", "said_by": "SH-01", "location": "L10", "claim_type": "opinion" }
      ],
      "stakeholders": [
        { "id": "SH-01", "name": "Sarah Kim", "role": "Operations manager", "organisation": "Acme Logistics" }
      ]
    }
input: |
  Run the BA agent. The run folder is .factory/runs/r1
rules:
  - rule: json_schema
    file: .factory/runs/r1/proposal.json
    schema: ba-proposal
  - rule: evidence_subset
    file: .factory/runs/r1/proposal.json
    input: .factory/runs/r1/input.json
  - rule: regex
    in: { file: .factory/runs/r1/proposal.json }
    pattern: '"brs":\s*\[\s*\]'
  # Exactly one parked ask: an entry opens once and no second one follows.
  - rule: regex
    in: { file: .factory/runs/r1/proposal.json }
    pattern: '"parked":\s*\[\s*\{[^{}]*\}\s*\]'
